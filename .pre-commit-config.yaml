# Run `pre-commit install` once after creating the dev venv.
# Frontend hooks need `npm install` in frontend/ first. CI runs them in the frontend job.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=2048"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: frontend lint (oxlint + eslint)
        entry: npm --prefix frontend run lint:check --silent
        language: system
        files: ^frontend/.*\.(ts|vue|js|mjs)$
        pass_filenames: false
      - id: frontend-format
        name: frontend format (prettier)
        entry: npm --prefix frontend run format:check --silent
        language: system
        files: ^frontend/src/
        pass_filenames: false
