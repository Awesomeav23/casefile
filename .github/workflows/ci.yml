name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit is scanned
      - name: Scan for secrets (gitleaks)
        run: docker run --rm -v "$GITHUB_WORKSPACE":/repo zricethezav/gitleaks:v8.30.1 git /repo --redact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt
      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # Backend tests (PostgreSQL service), frontend tests, and e2e jobs are added in M1, M2, and M7+.
