name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so every commit is scanned
      - name: Scan for secrets (gitleaks)
        run: docker run --rm -v "$GITHUB_WORKSPACE":/repo zricethezav/gitleaks:v8.30.1 git /repo --redact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install dev tooling
        run: pip install -r requirements-dev.txt
      - name: Run pre-commit hooks
        # Frontend hooks need node_modules; the frontend job runs the same checks.
        env:
          SKIP: frontend-lint,frontend-format
        run: pre-commit run --all-files --show-diff-on-failure

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: casefile
          POSTGRES_USER: casefile
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casefile -d casefile"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://casefile:ci_only_password@localhost:5432/casefile
      SECRET_KEY: ci-only-not-a-real-secret
      DEBUG: "false"
      ALLOWED_HOSTS: localhost,127.0.0.1
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: System check
        run: python manage.py check
      - name: Migrate from zero
        run: python manage.py migrate --noinput
      - name: No missing migrations
        run: python manage.py makemigrations --check --dry-run
      - name: OpenAPI schema is valid
        run: python manage.py spectacular --validate --fail-on-warn --file /dev/null
      - name: Validate every case (and the fixture)
        run: python manage.py validate_case --all ../content/cases/_fixtures/mini-case
      - name: Import cases (second run must be a no-op) and collect assets
        run: |
          python manage.py import_case --all ../content/cases/_fixtures/mini-case
          python manage.py import_case --all ../content/cases/_fixtures/mini-case | grep -c "unchanged"
          python manage.py collect_case_assets --include-fixtures
      - name: Tests
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:check
      - name: Format
        run: npm run format:check
      - name: Type-check
        run: npm run type-check
      - name: Unit and component tests (incl. axe and token contrast)
        run: npm test
      - name: Build
        run: npm run build-only

  api-contract:
    # The committed TypeScript API types must match the schema Django generates.
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://unused:unused@localhost:5432/unused
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Regenerate API types
        run: npm --prefix frontend run api:types
      - name: Types are up to date
        run: git diff --exit-code -- frontend/src/api/schema.d.ts

  e2e:
    # Real browser (Chromium) against Django + Vite started by Playwright (e2e/playwright.config.ts).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: casefile
          POSTGRES_USER: casefile
          POSTGRES_PASSWORD: ci_only_password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U casefile -d casefile"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      E2E_DATABASE_URL: postgres://casefile:ci_only_password@localhost:5432/casefile_e2e
      SECRET_KEY: ci-only-not-a-real-secret
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install
        run: |
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
          npm ci --prefix e2e
          npx --prefix e2e playwright install --with-deps chromium
      - name: Run E2E tests
        working-directory: e2e
        run: npx playwright test
      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
