briefing: |
  On the evening of Friday 13 March, the Ashcombe Gallery held a private preview of its spring
  exhibition. At 22:15 a guest noticed that *The Cartographer's Daughter* (1891, Aurélie Marchand),
  the gallery's most valuable work, insured for £2.4 million, was gone from the locked East Room.

  The alarm never sounded. Nobody has left the grounds with anything large enough to hold the
  canvas. You have the morning before the insurer's investigators arrive.
objective: |
  Determine who took the painting, how they removed it without triggering the alarm, why they
  did it, and where it is now.
