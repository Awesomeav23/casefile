summary: Corinne Blake stole the Marchand during the intermission, using an alarm override she set up that afternoon, to sell it before she was dismissed.
narrative: |
  Corinne learned from a draft letter that Vivian meant to dismiss her and sell the Marchand. A
  private buyer had approached her months earlier. At 15:10 she logged a maintenance override,
  under cover of an alarm test she had asked for, and scheduled a bypass for the East Room sensor.
  At 16:02 she booked a courier from her workstation to collect "one crate, Okafor Studio – return".

  Her talk was printed as 21:30–22:00, but she ended it at 21:45 with an intermission slide.
  Between 21:47 and 22:03 she cut the canvas from its frame, wearing handling gloves, and packed it
  into the crate in the loading bay. The bypass made the CCTV recorder restart, so nothing was
  recorded between 21:48 and 22:04.
