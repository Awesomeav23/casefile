intro: You get one accusation. Afterwards the solution is revealed.
questions:
  - key: culprit
    prompt: Who took the bicycle?
    kind: person
    required_for_solve: true
  - key: motive
    prompt: Why?
    kind: choice
    options:
      - { key: needed-a-bike, label: She needed a bicycle while hers was being repaired. }
      - { key: sell-for-cash, label: She planned to sell it for cash. }
      - { key: prank, label: It was a prank that went too far. }
      - { key: revenge, label: She wanted revenge over a garden dispute. }
    cite: { min: 1, max: 1, prompt: Cite what proves the motive. }
